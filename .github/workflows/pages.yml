# Publishes the online demo (scripts/build-pages.sh) to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default; each job asks for only what it needs. The build runs third-party
# install scripts, so it never holds the token that can publish.
permissions: {}

# One deployment at a time; a newer push waits for the one running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # 10.6 or newer applies the dependency pins in pnpm-workspace.yaml.
          version: 10

      - uses: actions/setup-node@v7
        with:
          # The one place the Node version is set: .nvmrc, which `nvm use` reads locally too.
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Test
        # The log shows the readable spec report. A second, TAP report goes to a file, and on failure
        # its failing tests are repeated as one error annotation, so the reason shows on the run page
        # and through the public API without opening the job log. Node 24 prints spec even when piped,
        # so TAP is asked for by name.
        run: |
          status=0
          node --test --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=tap --test-reporter-destination=test.tap || status=$?
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -A14 '^[[:space:]]*not ok' test.tap | head -c 30000 || true)
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=node --test failed::${msg}"
          fi
          exit "$status"

      - name: Build the demo
        run: bash scripts/build-pages.sh pages-out

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
