# Publishes the online demo (scripts/build-pages.sh) to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default; each job asks for only what it needs. The build runs third-party
# install scripts, so it never holds the token that can publish.
permissions: {}

# One deployment at a time; a newer push waits for the one running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # 10.6 or newer applies the dependency pins in quiz/pnpm-workspace.yaml.
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 22.18 or newer runs the TypeScript tests without a flag.
          node-version: 22
          cache: pnpm
          cache-dependency-path: quiz/pnpm-lock.yaml

      - run: pnpm --dir quiz install --frozen-lockfile

      - name: Test
        # On failure, repeat the failing tests as one error annotation, so the reason shows on the
        # run page and through the public API without opening the job log.
        run: |
          status=0
          node --test > test.log 2>&1 || status=$?
          cat test.log
          if [ "$status" -ne 0 ]; then
            msg=$(grep -E -A14 '^[[:space:]]*not ok' test.log | head -c 30000 || true)
            msg="${msg//'%'/'%25'}"
            msg="${msg//$'\r'/'%0D'}"
            msg="${msg//$'\n'/'%0A'}"
            echo "::error title=node --test failed::${msg}"
          fi
          exit "$status"

      - name: Build the demo
        run: bash scripts/build-pages.sh pages-out

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
